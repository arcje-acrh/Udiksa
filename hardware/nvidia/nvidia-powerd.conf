# nvidia-powerd (NVIDIA Dynamic Boost) -- installed by ~/Udiksa/hardware/nvidia/install.sh as
# /etc/systemd/system/nvidia-powerd.service.d/udiksa.conf
# supergfxd starts nvidia-powerd on every switch to Standard; while the card is off (Eco) it exits at once. The stock unit
# allows only 5 starts per boot (StartLimitIntervalSec=infinity), so a few mode switches left it refusing to start.
[Unit]
StartLimitIntervalSec=0
