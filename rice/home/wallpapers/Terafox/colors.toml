# Terafox -- the colours of this theme.
# HOW TO CHANGE THEM: edit the "#rrggbb" values below and save, then pick the theme again (Super+T) or run
# `rice-theme reapply`. Every line says what it colours. Tip: change `accent` first, it is the theme's colour.
# Delete this file and the colours are made from this folder's pictures again.
# (official Nightfox Terafox (sea-green accent) -- change anything you like)

mode = "dark"                     # dark or light (light = light backgrounds, dark text)

accent = "#7aa4a1"                # THE theme colour: selected / active things, switches that are on, window border, prompt ❯, highlights
selection = "#293e40"             # buttons, empty part of sliders, selected text background
muted = "#587b7b"                 # faint things: icons that are off, hints, disabled text

background = "#152528"            # main background: the notch, the terminal, app windows
dark_background = "#0f1c1e"       # a darker shade of the background
darker_background = "#0a1416"     # the darkest shade
lighter_background = "#1d3337"    # panels and cards (a bit lighter than the background)

foreground = "#e6eaea"            # normal text
dark_foreground = "#cbd9d8"       # secondary text: labels, notes, the prompt's branch/time
light_foreground = "#eaeeee"      # brighter text
bright_foreground = "#eaeeee"     # brightest text + the terminal cursor

red = "#e85c51"                   # terminal + errors
yellow = "#fda47f"                # terminal + warnings
orange = "#ff8349"                # terminal
green = "#7aa4a1"                 # terminal + success
cyan = "#a1cdd8"                  # terminal
blue = "#5a93aa"                  # terminal + links
magenta = "#ad5c7c"               # terminal + git changes in the prompt

bright_red = "#eb746b"            # terminal (bold/bright versions)
bright_yellow = "#fdb292"
bright_green = "#8eb2af"
bright_cyan = "#afd4de"
bright_blue = "#73a3b7"
bright_magenta = "#b97490"
