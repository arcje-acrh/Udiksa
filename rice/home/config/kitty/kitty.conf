# kitty — terminal. Colours live in colors.conf (matugen target).
include colors.conf

# ---- font ----
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ---- window: padding + transparency (blur comes from Hyprland) ----
window_padding_width     16
background_opacity       0.75
dynamic_background_opacity yes
hide_window_decorations  yes
confirm_os_window_close  0

# ---- cursor ----
cursor_shape             beam
cursor_beam_thickness    1.6
cursor_blink_interval    0
# The smear animation when the cursor jumps. It uses the cursor colour
# (colors.conf) unless cursor_trail_color is set.
#   cursor_trail        0 = off; otherwise minimum ms of movement to trigger it
#   cursor_trail_decay  <fast> <slow> fade times in seconds (bigger = longer trail)
#   cursor_trail_color  e.g. #5aa9f0 (uncomment to override the cursor colour)
cursor_trail             3
cursor_trail_decay       0.10 0.40
#cursor_trail_color      #5aa9f0

# ---- tabs (only shown with 2+ tabs) ----
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_min_tabs         2
tab_bar_edge             bottom

# ---- behaviour ----
scrollback_lines         20000
copy_on_select           clipboard
mouse_hide_wait          3
url_style                curly
enable_audio_bell        no
window_alert_on_bell     no
