# Udiksa: after writing the hibernation image, power off plainly instead of entering the firmware's S4 state
# ("platform", the default). Some laptops (seen on an ASUS Zephyrus G16) don't come out of S4 on the power button;
# a plain power-off always boots normally, and the saved session is restored the same way.
[Sleep]
HibernateMode=shutdown
