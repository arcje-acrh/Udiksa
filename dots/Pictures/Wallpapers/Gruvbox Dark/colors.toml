# Gruvbox Dark -- the colours of this theme.
# HOW TO CHANGE THEM: edit the "#rrggbb" values below and save, then pick the theme again (Super+T) or run
# `udiksa theme reapply`. Every line says what it colours. Tip: change `accent` first, it is the theme's colour.
# Delete this file and the colours are made from this folder's pictures again.
# (official gruvbox dark, medium contrast (yellow accent) -- change anything you like)

mode = "dark"                     # dark or light (light = light backgrounds, dark text)

accent = "#fabd2f"                # THE theme colour: selected / active things, switches that are on, window border, prompt ❯, highlights
selection = "#504945"             # buttons, empty part of sliders, selected text background
muted = "#7c6f64"                 # faint things: icons that are off, hints, disabled text

background = "#282828"            # main background: the notch, the terminal, app windows
dark_background = "#1d2021"       # a darker shade of the background
darker_background = "#141617"     # the darkest shade
lighter_background = "#3c3836"    # panels and cards (a bit lighter than the background)

foreground = "#ebdbb2"            # normal text
dark_foreground = "#a89984"       # secondary text: labels, notes, the prompt's branch/time
light_foreground = "#d5c4a1"      # brighter text
bright_foreground = "#fbf1c7"     # brightest text + the terminal cursor

red = "#cc241d"                   # terminal + errors
yellow = "#d79921"                # terminal + warnings
orange = "#fe8019"                # terminal
green = "#98971a"                 # terminal + success
cyan = "#689d6a"                  # terminal
blue = "#458588"                  # terminal + links
magenta = "#b16286"               # terminal + git changes in the prompt

bright_red = "#fb4934"            # terminal (bold/bright versions)
bright_yellow = "#fabd2f"
bright_green = "#b8bb26"
bright_cyan = "#8ec07c"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
