# mpv -- the default player for videos and music (rice 2026-09-27). Colours of the on-screen bar:
# script-opts/osc.conf (written by udiksa theme on every theme change).
hwdec=auto-safe              # Intel VA-API hardware decoding (less CPU, less battery)
keep-open=yes                # stay on the last frame instead of closing at the end
save-position-on-quit=yes    # resume where you left off
force-window=yes             # music files also get a window (cover art + controls)
osd-font="Iosevka Nerd Font"
osd-font-size=32
sub-font="Iosevka Nerd Font"
screenshot-directory=~/Pictures/Screenshots
