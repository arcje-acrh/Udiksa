# udiksa-hibernate.conf -- faster hibernation (Udiksa rice). Applied at every boot by systemd-tmpfiles.
# image_size 0 = save as little as possible: the kernel drops its disk cache first and saves only real memory
#   (the default, 2/5 of RAM, saved ~9 GB on a 32 GB laptop -> a long dark screen while it was read back).
# lz4 = several times faster to decompress than the default lzo (the resume reads the kind from the image).
w /sys/power/image_size                     - - - - 0
w /sys/module/hibernate/parameters/compressor - - - - lz4
