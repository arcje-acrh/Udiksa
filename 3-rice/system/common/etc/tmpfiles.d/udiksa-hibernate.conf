# udiksa-hibernate.conf -- faster hibernation (Udiksa rice). Applied at every boot by systemd-tmpfiles.
# image_size 4 GiB: the saved memory is capped there (the default, 2/5 of RAM, saved ~9 GB on a 32 GB laptop -> a long
#   dark screen while it was read back), but the most recently used files stay cached. 0 (tried 2026-09-28) threw ALL
#   of them away: going to sleep took ~25 s squeezing memory, and after waking the shell / Hyprland had to read their
#   code back from disk first -> the lock screen came up slowly.
# lz4 = several times faster to decompress than the default lzo (the resume reads the kind from the image).
w /sys/power/image_size                     - - - - 4294967296
w /sys/module/hibernate/parameters/compressor - - - - lz4
